<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seekah TUI 核准設計稿</title><style>:root{color-scheme:light dark}body{margin:0}</style></head>
<body>
<div id="qi-terminal" aria-label="Seekah TUI 視覺與鍵盤互動設計稿">
<style>
#qi-terminal{--qi-bg:light-dark(#f5f3ef,#131416);--qi-panel:light-dark(#ebe8e2,#1e2023);--qi-text:light-dark(#272a2e,#dddeda);--qi-muted:light-dark(#626970,#9a9eaa);--qi-line:light-dark(#d6d3ce,#303339);--qi-accent:light-dark(#226e78,#95d6d5);--qi-active:light-dark(#dee8e6,#253336);--qi-mark:light-dark(#d8e6ce,#374336);--qi-warn:light-dark(#86581c,#dbb879);font:14px/1.65 'Cascadia Mono','SFMono-Regular',Consolas,'Noto Sans Mono CJK TC',monospace;color:var(--qi-text);background:var(--qi-bg);width:100%;box-sizing:border-box;container-type:inline-size}
#qi-terminal *{box-sizing:border-box}#qi-terminal button,#qi-terminal input{font:inherit;color:inherit;border-radius:0}#qi-terminal button{border:0;background:transparent;text-align:left;padding:5px 8px;cursor:pointer}#qi-terminal button:focus-visible,#qi-terminal input:focus-visible{outline:2px solid var(--qi-accent);outline-offset:2px}#qi-terminal button:hover{background:var(--qi-panel)}#qi-terminal [hidden]{display:none!important}#qi-terminal .top{padding:15px 24px;background:var(--qi-panel);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}#qi-terminal .brand{letter-spacing:.06em;font-weight:500}#qi-terminal .accent{color:var(--qi-accent)}#qi-terminal .muted{color:var(--qi-muted)}#qi-terminal .small{font-size:12px}#qi-terminal .nav{padding:11px 18px 0;display:flex;gap:12px;flex-wrap:wrap}#qi-terminal .nav button[aria-pressed=true]{color:var(--qi-accent);border-bottom:2px solid var(--qi-accent)}#qi-terminal .stage{padding:22px 24px 12px;min-height:340px}#qi-terminal h2,#qi-terminal h3,#qi-terminal p{margin:0;font:inherit}#qi-terminal h2{font-size:16px;font-weight:500}#qi-terminal .summary{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:17px}#qi-terminal .row{display:grid;grid-template-columns:24px 22px minmax(0,1fr);gap:7px;padding:12px 10px;margin:3px 0;border-left:2px solid transparent}#qi-terminal .row.active{background:var(--qi-active);border-left-color:var(--qi-accent)}#qi-terminal .row .pointer{color:var(--qi-accent);padding-top:4px}#qi-terminal .row .check{padding:4px 0;color:var(--qi-accent)}#qi-terminal .row .file{min-width:0;padding:3px 0;width:100%}#qi-terminal .file strong{font-weight:500}#qi-terminal .name{display:flex;justify-content:space-between;gap:10px}#qi-terminal .name strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#qi-terminal .path{font-size:12px;color:var(--qi-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#qi-terminal .snippet{margin-top:3px;color:var(--qi-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#qi-terminal mark{background:var(--qi-mark);color:var(--qi-text)}#qi-terminal .home{padding:40px 0 32px;max-width:610px;margin:auto}#qi-terminal .wordmark{font-size:28px;letter-spacing:-1px;margin-bottom:6px}#qi-terminal .recent{margin-top:28px}#qi-terminal .recent button{display:block;width:100%;color:var(--qi-muted);padding:7px 0}#qi-terminal .preview-title{border-left:2px solid var(--qi-accent);padding:8px 14px;background:var(--qi-panel);margin:16px 0 20px}#qi-terminal .document{max-width:720px;white-space:pre-wrap;overflow-wrap:anywhere;padding:0 14px;line-height:1.95}#qi-terminal .location{color:var(--qi-accent);margin:18px 0 6px}#qi-terminal .pagebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:10px;border-top:1px solid var(--qi-line)}#qi-terminal .composer{margin:6px 24px 0;padding:12px 16px;background:var(--qi-panel);border-left:2px solid var(--qi-accent)}#qi-terminal .composer-line{display:flex;gap:12px;align-items:center}#qi-terminal input{background:transparent;border:0;min-width:0;width:100%;padding:5px 0}#qi-terminal .composer-meta{margin-top:7px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--qi-muted)}#qi-terminal .footer{padding:11px 24px 16px;display:flex;gap:10px 20px;justify-content:space-between;flex-wrap:wrap;font-size:12px;color:var(--qi-muted)}#qi-terminal .keys{display:flex;gap:8px 17px;flex-wrap:wrap}#qi-terminal kbd{font:inherit;color:var(--qi-text)}#qi-terminal .notice{padding:9px 24px;color:var(--qi-muted);font-size:12px;border-bottom:1px solid var(--qi-line)}#qi-terminal .notice .warn{color:var(--qi-warn)}#qi-terminal .palette{padding:18px;background:var(--qi-panel);max-width:580px;margin:10px auto}#qi-terminal .palette button{display:flex;width:100%;justify-content:space-between;gap:15px;padding:12px}#qi-terminal .confirm{margin-top:22px;padding:14px;border-left:2px solid var(--qi-warn);background:var(--qi-panel)}#qi-terminal .layout-actions{display:flex;gap:12px;flex-wrap:wrap}#qi-terminal .layout-actions button{color:var(--qi-accent)}#qi-terminal .end{padding:90px 0;text-align:center}#qi-terminal .tag{font-size:12px;color:var(--qi-muted);white-space:nowrap}#qi-terminal[data-density=compact] .row{padding-top:6px;padding-bottom:6px}#qi-terminal[data-density=compact] .snippet{display:none}
@container(max-width:540px){#qi-terminal .top{padding:12px 15px}#qi-terminal .stage{padding:18px 13px 10px}#qi-terminal .composer{margin:6px 13px 0;padding:10px}#qi-terminal .footer{padding:10px 13px}#qi-terminal .row{grid-template-columns:14px 20px minmax(0,1fr);gap:4px;padding-left:4px;padding-right:4px}#qi-terminal .tag{display:none}#qi-terminal .nav{gap:4px;padding-left:8px}#qi-terminal .notice{padding:9px 13px}#qi-terminal .wordmark{font-size:24px}#qi-terminal .small-hide{display:none}}
@media(pointer:coarse){#qi-terminal button{min-height:44px}#qi-terminal input{font-size:16px}}
</style>
<div class="top"><span class="brand"><span class="accent">▌</span> seekah <span class="muted small">/ Seekah</span></span><span class="small muted">TUI 設計稿 · 示範資料</span></div>
<div class="nav" aria-label="設計稿畫面"><button type="button" data-view="home">首頁</button><button type="button" data-view="results" aria-pressed="true">搜尋結果</button><button type="button" data-view="selected">已選文件 <span id="qi-count">1</span></button><button type="button" data-view="commands">/ 命令</button></div>
<div class="notice"><span class="accent">● 背景監看中</span><span class="small-hide">　D:\工作資料</span>　<span class="warn">部分範圍待確認</span></div>
<main class="stage" id="qi-stage"></main>
<form class="composer" id="qi-search"><div class="composer-line"><label class="accent" for="qi-query">搜尋 ›</label><input id="qi-query" aria-label="搜尋示範文件" value="複製回本機 安裝" autocomplete="off"><button type="submit" aria-label="執行示範搜尋">↵</button></div><div class="composer-meta"><span class="accent">全部關鍵字</span><span>D:\工作資料</span><span>全部格式</span><span>本機搜尋</span></div></form>
<div class="footer"><div class="keys" id="qi-keys"></div><span>Ctrl+C 離開</span></div>
<div id="qi-announcement" aria-live="polite" class="notice">設計預覽：可點選畫面、移動游標與勾選；不會讀取本機文件。</div>
<script>
(()=>{
const root=document.getElementById('qi-terminal'),stage=root.querySelector('#qi-stage'),input=root.querySelector('#qi-query'),keys=root.querySelector('#qi-keys'),announcement=root.querySelector('#qi-announcement');
const docs=[
{name:'用戶端安裝手冊.docx',type:'DOCX',path:'D:\\工作資料\\安裝指引',location:'第 2 段',text:'將安裝檔複製回本機後，執行安裝程式。',body:'一、安裝前準備\n\n將安裝檔複製回本機後，執行安裝程式。\n確認作業環境與安裝路徑，並關閉目前使用中的程式。\n\n二、執行安裝\n\n依畫面指引完成設定。安裝結束後重新開啟用戶端。\n\n三、確認結果\n\n開啟測試文件，核對版本與連線狀態。'},
{name:'系統部署筆記.md',type:'MD',path:'D:\\工作資料\\技術筆記',location:'第 18 行',text:'部署前先複製回本機，核對版本後再開始安裝。',body:'部署檢查清單\n\n部署前先複製回本機，核對版本後再開始安裝。\n\n確認檔案完整、備份設定，並記錄本次更新版本。'},
{name:'新人環境設定.pdf',type:'PDF',path:'D:\\工作資料\\新人訓練',location:'第 6 頁',text:'請把工具包複製回本機，依序完成各項安裝。',body:'工作環境設定\n\n請把工具包複製回本機，依序完成各項安裝。\n\n完成後重新登入，並向窗口確認環境設定。'},
{name:'環境建置說明.pptx',type:'PPTX',path:'D:\\工作資料\\簡報',location:'投影片 12',text:'複製回本機 → 檢查設定 → 安裝 → 驗證。',body:'環境建置流程\n\n複製回本機 → 檢查設定 → 安裝 → 驗證。\n\n本投影片列出建置所需的四個步驟。'}];
const state={view:'results',cursor:0,selected:new Set([0]),query:input.value,previous:'results',theme:'system',density:'comfortable'};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function highlight(s){let parts=s.split(/(複製回本機|安裝)/g);return parts.map(p=>p==='複製回本機'||p==='安裝'?'<mark>'+p+'</mark>':esc(p)).join('');}
function matches(){const terms=state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);return docs.map((d,i)=>i).filter(i=>terms.every(t=>(docs[i].name+' '+docs[i].text).toLowerCase().includes(t)));}
function ids(){return state.view==='selected'?[...state.selected]:matches();}
function save(){window.openai?.setWidgetState?.({modelContent:{design:'seekah-tui',theme:state.theme,density:state.density},privateContent:{view:state.view,selected:[...state.selected],cursor:state.cursor,query:state.query}})?.catch(()=>{});}
function setView(v){state.previous=state.view==='selected'?'selected':'results';state.view=v;render();save();}
function toggle(i){state.selected.has(i)?state.selected.delete(i):state.selected.add(i);announcement.textContent='已選 '+state.selected.size+' 份文件';render();save();}
function row(i){const d=docs[i];return '<div class="row '+(i===state.cursor?'active':'')+'"><span class="pointer">'+(i===state.cursor?'›':' ')+'</span><button type="button" class="check" data-toggle="'+i+'" aria-label="選取 '+esc(d.name)+'" aria-pressed="'+state.selected.has(i)+'">'+(state.selected.has(i)?'[x]':'[ ]')+'</button><button type="button" class="file" data-file="'+i+'"><span class="name"><strong>'+esc(d.name)+'</strong><span class="tag">'+d.type+'</span></span><span class="path">'+esc(d.path)+'</span><div class="snippet">'+esc(d.location)+' · '+highlight(d.text)+'</div></button></div>';}
function render(){const hadFocus=stage.contains(document.activeElement);root.style.colorScheme=state.theme==='system'?'light dark':state.theme;root.dataset.density=state.density;root.querySelector('#qi-count').textContent=state.selected.size;root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));root.querySelector('#qi-search').hidden=['preview','context','closed','commands'].includes(state.view);
let hint='<span><kbd>↑↓</kbd> 移動</span><span><kbd>Space</kbd> 選取</span><span><kbd>Enter</kbd> 預覽</span><span><kbd>/</kbd> 搜尋</span><span><kbd>q</kbd> 離開</span>';
if(state.view==='home'){stage.innerHTML='<div class="home"><div class="wordmark">see<span class="accent">kah</span></div><p class="muted">從自己的文件，找到需要的答案。</p><div class="recent"><div class="small muted">最近搜尋 · 本次工作階段</div><button type="button" data-query="複製回本機 安裝">↗ 複製回本機 安裝</button><button type="button" data-query="部署">↗ 部署</button></div></div>';hint='<span><kbd>Enter</kbd> 搜尋</span><span><kbd>Tab</kbd> 切換區域</span><span><kbd>/</kbd> 命令</span>';}
else if(state.view==='results'||state.view==='selected'){const list=ids();if(list.length&&!list.includes(state.cursor))state.cursor=list[0];stage.innerHTML='<div class="summary"><div><h2>'+ (state.view==='selected'?'已選文件':'搜尋結果')+'</h2><span class="small muted">'+(state.view==='selected'?'選取跨頁保留 · 最多 20 份':esc(state.query)+' · 全部關鍵字')+'</span></div><span class="muted small">'+list.length+' 份文件</span></div>'+ (list.length?list.map(row).join(''):'<div class="home"><h2>'+(state.view==='selected'?'還沒有選取文件':'找不到符合的文件')+'</h2><p class="muted">'+(state.view==='selected'?'回到搜尋結果，按 Space 加入文件。':'試著減少關鍵字，或搜尋「安裝」。')+'</p></div>')+'<div class="pagebar"><span class="muted small">'+(list.length?'第 1 / 1 頁 · PgUp / PgDn 翻頁':'沒有其他頁面')+'</span><div class="layout-actions"><button type="button" data-action="context" '+(!state.selected.size?'disabled':'')+'>預覽選取內容 →</button></div></div>';}
else if(state.view==='preview'){const d=docs[state.cursor];stage.innerHTML='<div class="summary"><button type="button" data-action="back">← 返回結果</button><button type="button" data-toggle="'+state.cursor+'">'+(state.selected.has(state.cursor)?'[x] 已選取':'[ ] 加入選取')+'</button></div><div class="preview-title"><h2>'+esc(d.name)+'</h2><div class="path">'+esc(d.path)+' · '+d.type+'</div></div><div class="document"><div class="location">命中位置 · '+d.location+'</div>'+highlight(d.body)+'</div>';hint='<span><kbd>Esc / ←</kbd> 返回</span><span><kbd>Space</kbd> 選取</span><span><kbd>q</kbd> 離開</span>';}
else if(state.view==='context'){stage.innerHTML='<div class="summary"><h2>選取內容預覽</h2><button type="button" data-view="selected">← 返回已選文件</button></div><div class="small muted">'+state.selected.size+' 份 · 本機準備 · 尚未複製或傳送</div>'+[...state.selected].map(i=>'<div class="preview-title">'+esc(docs[i].name)+'</div><div class="document">'+highlight(docs[i].text)+'</div>').join('')+'<div class="confirm"><label for="qi-confirm">檢查內容後輸入 yes，確認複製</label><form id="qi-confirm-form"><input id="qi-confirm" placeholder="yes" autocomplete="off"><button type="submit">確認（示範） ↵</button></form></div>';hint='<span><kbd>Esc</kbd> 取消返回</span><span><kbd>yes + Enter</kbd> 確認</span>';}
else if(state.view==='commands'){stage.innerHTML='<div class="palette"><div class="summary"><h2>命令</h2><button type="button" data-view="results">Esc 返回</button></div><button type="button" data-view="results"><span>/search　搜尋文件</span><span class="muted">/</span></button><button type="button" data-view="selected"><span>/selected　已選文件</span><span class="muted">Tab</span></button><button type="button" data-action="context"><span>/context　預覽選取內容</span><span class="muted">↵</span></button><button type="button" data-action="status"><span>/status　背景索引狀態</span><span class="muted">↵</span></button><button type="button" data-view="closed"><span>/quit　離開</span><span class="muted">q</span></button></div>';hint='<span><kbd>Tab</kbd> 移動</span><span><kbd>Enter</kbd> 執行</span><span><kbd>Esc</kbd> 返回</span>';}
else if(state.view==='closed'){stage.innerHTML='<div class="end"><p>已離開介面（示範）</p><p class="muted small">實際產品退出後還原終端。</p><button type="button" data-view="results">重新開啟設計稿 →</button></div>';hint='';}
keys.innerHTML=hint;if(hadFocus){const target=stage.querySelector('[data-file="'+state.cursor+'"]')||stage.querySelector('button');target?.focus();}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)setView(b.dataset.view);if(b.dataset.query){input.value=b.dataset.query;state.query=input.value;setView('results');}if(b.dataset.toggle!==undefined)toggle(Number(b.dataset.toggle));if(b.dataset.file!==undefined){state.cursor=Number(b.dataset.file);setView('preview');}if(b.dataset.action==='back')setView(state.previous);if(b.dataset.action==='context'){if(state.selected.size)setView('context');else announcement.textContent='請先選取文件。';}if(b.dataset.action==='status')announcement.textContent='示範狀態：背景 watcher 運行中；部分範圍尚待校正。';});
root.querySelector('#qi-search').addEventListener('submit',e=>{e.preventDefault();state.query=input.value;setView(input.value.trim()==='/'?'commands':'results');});
root.addEventListener('submit',e=>{if(e.target.id!=='qi-confirm-form')return;e.preventDefault();announcement.textContent=root.querySelector('#qi-confirm').value==='yes'?'示範確認完成；未操作實際剪貼簿。':'請輸入 yes，或按 Esc 取消。';});
root.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='c'){e.preventDefault();setView('closed');return;}if(e.key==='Escape'){e.preventDefault();setView(state.view==='context'?'selected':'results');return;}if(e.target.tagName==='INPUT')return;if(e.key==='q'){e.preventDefault();setView('closed');return;}if(e.key==='/'){e.preventDefault();setView('results');input.focus();input.select();return;}if(['results','selected'].includes(state.view)){const list=ids();if(!list.length)return;const at=list.indexOf(state.cursor);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();state.cursor=list[Math.max(0,Math.min(list.length-1,at+(e.key==='ArrowDown'?1:-1)))];render();save();}else if(e.key===' '){e.preventDefault();toggle(state.cursor);}else if(e.key==='Enter'){e.preventDefault();setView('preview');}else if(['PageDown','PageUp'].includes(e.key)){e.preventDefault();announcement.textContent='示範結果共一頁，已在'+(e.key==='PageDown'?'最後':'第一')+'頁。';}}else if(state.view==='preview'){if(e.key==='ArrowLeft'){e.preventDefault();setView(state.previous);}if(e.key===' '){e.preventDefault();toggle(state.cursor);}}});
function restore(saved){if(!saved)return;const m=saved.modelContent,p=saved.privateContent;if(m){if(['system','light','dark'].includes(m.theme))state.theme=m.theme;if(['comfortable','compact'].includes(m.density))state.density=m.density;}if(p){if(['home','results','selected','preview','commands','context','closed'].includes(p.view))state.view=p.view;if(Array.isArray(p.selected))state.selected=new Set(p.selected.filter(i=>Number.isInteger(i)&&i>=0&&i<docs.length));if(Number.isInteger(p.cursor)&&p.cursor>=0&&p.cursor<docs.length)state.cursor=p.cursor;if(typeof p.query==='string'){state.query=p.query;input.value=p.query;}}}
restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);render();});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(state,'theme',{label:'色彩',options:[{label:'跟隨系統',value:'system'},{label:'石墨深色',value:'dark'},{label:'紙白淺色',value:'light'}]});tweak.addSelect(state,'density',{label:'結果密度',options:[{label:'舒適 · 路徑與片段',value:'comfortable'},{label:'緊湊 · 更多文件',value:'compact'}]});}
})();
</script>
</div>

</body>
</html>
